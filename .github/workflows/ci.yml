name: CI

# Every pull request, plus main itself so a squash merge is verified too.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # The build needs no secrets: every process.env read in pages/api/chat.js
      # happens inside the handler, never at module scope.
      - run: npm run build
